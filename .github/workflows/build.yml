name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q -o zoompro-github.zip -d src
          echo "--- محتويات src ---"
          find src -maxdepth 2 | head -30
          P=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk ZoomPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZoomPro-apk
          path: ${{ env.PROJECT_DIR }}/ZoomPro.apk
          if-no-files-found: error
