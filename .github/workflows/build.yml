name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "zoompro-github.zip" ]; then
            echo "Unzipping project..."
            unzip -o zoompro-github.zip -d extracted_project
            cd extracted_project
            # الانتقال للمجلد الداخلي إذا وجد
            if [ -d "zoompro-github" ]; then cd zoompro-github; fi
            # نقل الملفات للمجلد الرئيسي لتسهيل البناء
            cp -r . ../../
            cd ../../
          else
            echo "Zip file not found, continuing with repository files..."
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew || chmod +x **/gradlew || echo "gradlew not found yet"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            find . -name gradlew -exec {} assembleDebug \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
